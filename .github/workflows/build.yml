# Builds CutFree.exe on GitHub (Windows) and attaches it to a release.
# New release: push a tag like v1.0.0 – or start it manually under "Actions".
name: Build CutFree.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build CutFree.exe
        shell: pwsh
        run: |
          $add = @('index.html','style.css','app.js','sfx.js','ai.js','gl.js','gl-transitions.json') | ForEach-Object { '--add-data'; "$_;." }
          pyinstaller --noconfirm --onefile --windowed --name CutFree --icon icon.ico @add server.py

      - uses: actions/upload-artifact@v4
        with:
          name: CutFree
          path: dist/CutFree.exe

      - name: Create release with download
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CutFree.exe
          generate_release_notes: true
