<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutFree Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Luckiest+Guy&family=Montserrat:wght@400;600;700;800;900&family=Pacifico&family=Permanent+Marker&family=Poppins:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="logo-mark">✂</span> CutFree</div>
  <input id="projectName" class="project-name" value="Mein Projekt" spellcheck="false">
  <div class="top-actions">
    <select id="aspectSel" title="Format">
      <option value="1080x1920">9:16 (TikTok / Reels)</option>
      <option value="1920x1080">16:9 (YouTube)</option>
      <option value="1080x1080">1:1 (Quadrat)</option>
      <option value="1080x1350">4:5 (Instagram)</option>
    </select>
    <select id="bgSel" title="Hintergrund">
      <option value="black">Hintergrund: Schwarz</option>
      <option value="blur">Hintergrund: Unschärfe</option>
      <option value="white">Hintergrund: Weiß</option>
    </select>
    <select id="langSel" title="Sprache / Language">
      <option value="de">🇩🇪 Deutsch</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <span id="saveState" class="muted small" title="Dein Projekt wird automatisch gespeichert"></span>
    <button id="newProj" title="Neues, leeres Projekt">＋ Neu</button>
    <button id="exportBtn" class="btn-primary">⬇ Exportieren</button>
  </div>
</header>

<main class="workspace">
  <!-- LEFT: Library -->
  <section class="panel library">
    <nav class="lib-tabs" id="libTabs">
      <button data-tab="media" class="active"><i>▣</i>Medien</button>
      <button data-tab="audio"><i>♫</i>Audio</button>
      <button data-tab="text"><i>T</i>Text</button>
      <button data-tab="stickers"><i>★</i>Sticker</button>
      <button data-tab="captions"><i>CC</i>Untertitel</button>
      <button data-tab="voice"><i>☺</i>Stimme</button>
      <button data-tab="effects"><i>✦</i>Effekte</button>
      <button data-tab="filters"><i>◐</i>Filter</button>
      <button data-tab="transitions"><i>⇄</i>Übergänge</button>
    </nav>
    <div class="lib-body" id="libBody"></div>
  </section>

  <!-- CENTER: Player -->
  <section class="panel player">
    <div class="player-head"><span>Player</span><span id="selInfo" class="muted"></span></div>
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage"></canvas>
      <div class="drop-hint" id="dropHint">Videos, Bilder oder Audio hier reinziehen</div>
    </div>
    <div class="player-controls">
      <span id="timeCur" class="tc">00:00.00</span>
      <span class="muted">/</span>
      <span id="timeDur" class="tc muted">00:00.00</span>
      <div class="pc-center">
        <button id="btnBack" title="Zum Anfang">⏮</button>
        <button id="btnPlay" class="play" title="Abspielen (Leertaste)">▶</button>
        <button id="btnFwd" title="Zum Ende">⏭</button>
      </div>
      <button id="btnFull" title="Vollbild">⛶</button>
    </div>
  </section>

  <!-- RIGHT: Properties -->
  <section class="panel props">
    <div class="props-head" id="propsHead">Eigenschaften</div>
    <div class="props-body" id="propsBody"></div>
  </section>
</main>

<!-- TIMELINE -->
<section class="timeline-area">
  <div class="tl-toolbar">
    <button id="tUndo" title="Rückgängig (Strg+Z)">↶</button>
    <button id="tRedo" title="Wiederholen (Strg+Y)">↷</button>
    <span class="sep"></span>
    <button id="tSplit" title="Teilen am Abspielkopf (S)">✂ Teilen</button>
    <button id="tSplitL" title="Links vom Abspielkopf löschen (Q)">⇤ Links weg</button>
    <button id="tSplitR" title="Rechts vom Abspielkopf löschen (W)">Rechts weg ⇥</button>
    <button id="tDup" title="Duplizieren (Strg+D)">⧉</button>
    <button id="tMark" title="Marker setzen/entfernen (M)">🚩</button>
    <button id="tCurve" title="Welche Kurve auf den Clips bearbeitet wird">〰 Kurve: Lautstärke</button>
    <button id="tDel" title="Löschen (Entf)">🗑</button>
    <span class="sep"></span>
    <label class="chk"><input type="checkbox" id="tSnap" checked> Magnet</label>
    <label class="chk"><input type="checkbox" id="tRipple"> Lücken schließen</label>
    <div class="tl-right">
      <button id="tZoomOut" title="Rauszoomen">−</button>
      <input type="range" id="tZoom" min="10" max="400" value="80">
      <button id="tZoomIn" title="Reinzoomen">+</button>
    </div>
  </div>
  <div class="tl-main">
    <div class="tl-heads" id="tlHeads"></div>
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-content" id="tlContent">
        <div class="tl-ruler" id="tlRuler"></div>
        <div class="tl-tracks" id="tlTracks"></div>
        <div class="tl-playhead" id="tlPlayhead"><div class="ph-knob"></div></div>
        <div class="tl-snapline" id="tlSnap"></div>
      </div>
    </div>
  </div>
</section>

<input type="file" id="fileInput" multiple accept="video/*,image/*,audio/*" hidden>

<!-- Export modal -->
<div class="modal" id="exportModal" hidden>
  <div class="modal-box">
    <h3>Video exportieren</h3>
    <label>Dateiname <input id="expName" value="mein-video"></label>
    <label>Qualität
      <select id="expQuality">
        <option value="4000000">Normal (4 Mbit/s)</option>
        <option value="8000000" selected>Hoch (8 Mbit/s)</option>
        <option value="16000000">Sehr hoch (16 Mbit/s)</option>
      </select>
    </label>
    <label>Bilder pro Sekunde
      <select id="expFps"><option>24</option><option selected>30</option><option>60</option></select>
    </label>
    <label class="chk"><input type="checkbox" id="expMute"> Ton während Export stumm</label>
    <p class="muted small">Export läuft in Echtzeit (ein 30-Sekunden-Video braucht ca. 30 Sekunden). Format: MP4, falls dein Browser es kann, sonst WebM.</p>
    <div class="progress" id="expProg" hidden><div></div></div>
    <div class="modal-actions">
      <button id="expCancel">Abbrechen</button>
      <button id="expStart" class="btn-primary">Export starten</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="i18n.js?v=15"></script>
<script src="sfx.js?v=15"></script>
<script src="gl.js?v=15"></script>
<script src="app.js?v=15"></script>
<script src="ai.js?v=15"></script>
</body>
</html>
